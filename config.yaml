# ============================================================================
# Strategy Profiles
# ============================================================================
strategies:

  # --------------------------------------------------------------------------
  # Growth Momentum — for K-shaped up-leg: AI/tech/semiconductor hot sectors
  # 进攻型：行业动量 + 个股趋势 + 放量确认，月度调仓
  # --------------------------------------------------------------------------
  growth:
    hold_days: 5       # weekly rebalance — momentum signals decay fast

    select_count:
      主板: 40
      创业板: 30
      科创板: 30

    stock_pool:
      markets: ["主板", "创业板", "科创板"]
      min_listing_days: 60
      max_suspend_days: 10
      min_daily_amount: 50000

    factors:
      trend:
        sector_momentum:
          weight: 0.22
          enabled: true
          direction: positive      # 行业20日涨幅中位数排名
        price_momentum:
          weight: 0.20
          enabled: true
          direction: positive      # 个股20日涨幅
        industry_hotness:
          weight: 0.08
          enabled: true
          direction: positive      # 行业10日热度（更短窗口）
        volume_breakout:
          weight: 0.10
          enabled: true
          direction: positive      # 成交量突破
        short_momentum:
          weight: 0.06
          enabled: true
          direction: positive      # 3日微动量：追涨

      growth:
        revenue_yoy:
          weight: 0.06
          enabled: true
          direction: positive
        profit_yoy:
          weight: 0.06
          enabled: true
          direction: positive

      quality:
        roe_ttm:
          weight: 0.06
          enabled: true
          direction: positive      # 质量底线：不买垃圾
        gross_margin:
          weight: 0.05
          enabled: true
          direction: positive

      size:
        small_cap:
          weight: 0.06
          enabled: true
          direction: positive      # 小盘弹性更大

      risk:
        volatility:
          weight: 0.05
          enabled: true
          direction: negative      # 控制极端波动

      # Total: 1.00; 66% trend/momentum, 17% quality/growth floor, 11% size/risk

  # --------------------------------------------------------------------------
  # Defensive Dividend — for K-shaped down-leg: income + safety + low vol
  # 防御型：高股息 + 低波动 + 质量，季度调仓
  # --------------------------------------------------------------------------
  defensive:
    hold_months: 3

    select_count:
      主板: 50
      创业板: 20
      科创板: 10            # 科创板少配（高波动与防御矛盾）

    stock_pool:
      markets: ["主板", "创业板", "科创板"]
      min_listing_days: 120     # 更严格：需要足够的财务和分红历史
      max_suspend_days: 10
      min_daily_amount: 50000

    factors:
      income:
        dividend_yield:
          weight: 0.18
          enabled: false          # FIXME: dv_ratio field availability on free tier unconfirmed
          direction: positive      # 核心：股息率
        ep_ttm:
          weight: 0.10
          enabled: true
          direction: positive      # 盈利收益率
        bp:
          weight: 0.07
          enabled: true
          direction: positive      # 净资产折价

      quality:
        roe_ttm:
          weight: 0.14
          enabled: true
          direction: positive
        gross_margin:
          weight: 0.07
          enabled: true
          direction: positive
        net_margin:
          weight: 0.07
          enabled: true
          direction: positive

      growth:
        revenue_yoy:
          weight: 0.04
          enabled: true
          direction: positive
        profit_yoy:
          weight: 0.04
          enabled: true
          direction: positive

      risk:
        volatility:
          weight: 0.10
          enabled: true
          direction: negative      # 低波动
        amplitude:
          weight: 0.05
          enabled: true
          direction: negative      # 低日内振幅
        amount_stability:
          weight: 0.05
          enabled: true
          direction: negative      # 成交额稳定
        volume_ratio:
          weight: 0.03
          enabled: true
          direction: positive      # 适度活跃

      size:
        small_cap:
          weight: 0.06
          enabled: true
          direction: positive      # 适度分散到中小价值

      # Total: 1.00; 35% income, 28% quality, 23% risk control, 8% growth

  # --------------------------------------------------------------------------
  # Value Investing — quality & valuation focus, quarterly rebalance (legacy)
  # --------------------------------------------------------------------------
  value:
    hold_months: 3

    select_count:
      主板: 50
      创业板: 20
      科创板: 20

    stock_pool:
      markets: ["主板", "创业板", "科创板"]
      min_listing_days: 60
      max_suspend_days: 10
      min_daily_amount: 50000      # 50M yuan (amount in thousands)

    factors:
      value:
        ep_ttm:
          weight: 0.15
          enabled: true
          direction: positive      # 1/PE
        bp:
          weight: 0.10
          enabled: true
          direction: positive      # 1/PB

      quality:
        roe_ttm:
          weight: 0.18
          enabled: true
          direction: positive      # EPS/BVPS
        gross_margin:
          weight: 0.12
          enabled: true
          direction: positive      # 毛利率
        net_margin:
          weight: 0.10
          enabled: true
          direction: positive      # 净利率

      growth:
        revenue_yoy:
          weight: 0.05
          enabled: true
          direction: positive      # 营收增速
        profit_yoy:
          weight: 0.05
          enabled: true
          direction: positive      # 利润增速

      size:
        small_cap:
          weight: 0.06
          enabled: true
          direction: positive      # -ln(total_assets)

      risk:
        volatility:
          weight: 0.10
          enabled: true
          direction: negative      # 低波动
        amplitude:
          weight: 0.03
          enabled: true
          direction: negative      # 低日内振幅
        amount_stability:
          weight: 0.02
          enabled: true
          direction: negative      # 成交额稳定
        volume_ratio:
          weight: 0.03
          enabled: true
          direction: positive      # 适度放量

      flow:
        industry_hotness:
          weight: 0.08
          enabled: true
          direction: positive      # 行业10日价格热度
        mf_ratio:
          weight: 0.05
          enabled: false           # disabled: Tushare free tier has no moneyflow data
          direction: positive

  # --------------------------------------------------------------------------
  # Small-Cap Speculation — size + reversal + low-vol, monthly rebalance
  # --------------------------------------------------------------------------
  smallcap:
    hold_months: 1

    select_count:
      主板: 30
      创业板: 30
      科创板: 30

    stock_pool:
      markets: ["主板", "创业板", "科创板"]
      min_listing_days: 60
      max_suspend_days: 10
      min_daily_amount: 30000      # 30M yuan — lower bar for small-caps

    factors:
      value:
        ep_ttm:
          weight: 0.05
          enabled: true
          direction: positive
        bp:
          weight: 0.03
          enabled: true
          direction: positive

      quality:
        roe_ttm:
          weight: 0.03
          enabled: true
          direction: positive
        gross_margin:
          weight: 0.03
          enabled: true
          direction: positive
        net_margin:
          weight: 0.03
          enabled: true
          direction: positive

      growth:
        revenue_yoy:
          weight: 0.03
          enabled: true
          direction: positive
        profit_yoy:
          weight: 0.03
          enabled: true
          direction: positive

      size:
        small_cap:
          weight: 0.18
          enabled: true
          direction: positive      # heavy tilt toward small

      risk:
        volatility:
          weight: 0.15
          enabled: true
          direction: negative
        amplitude:
          weight: 0.10
          enabled: true
          direction: negative
        amount_stability:
          weight: 0.07
          enabled: true
          direction: negative
        volume_ratio:
          weight: 0.05
          enabled: true
          direction: positive

      momentum:
        short_reversal:
          weight: 0.17
          enabled: true
          direction: positive      # 5-day reversal: buy recent losers
        short_momentum:
          weight: 0.05
          enabled: true
          direction: positive      # 3-day momentum: ride winners

      flow:
        industry_hotness:
          weight: 0.06
          enabled: true
          direction: positive
        mf_ratio:
          weight: 0.08
          enabled: false           # disabled: no moneyflow data
          direction: positive
