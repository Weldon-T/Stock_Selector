# ============================================================================
# Stock Selection Tool - Configuration
# ============================================================================

tushare_token: ""

paths:
  output_dir: ./output
  cache_dir: ./cache
  log_dir: ./logs

logging:
  level: INFO
  file: run.log

# Days of daily data to load for technical factors (must cover longest momentum window)
multi_daily_lookback: 25

# Default strategy
strategy: value

# ============================================================================
# ETF Recommendations — suggested funds per strategy line
# ============================================================================
etf_recommendations:
  growth:
    科创板:
      - {code: "588000", name: "科创50ETF"}
      - {code: "588080", name: "科创板50ETF"}
    半导体芯片:
