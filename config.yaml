# ============================================================================
# Stock Selection Tool - Configuration
# ============================================================================

# tushare_token is now read from .env (TUSHARE_TOKEN) for security.
# Fallback: you can still set it here, but .env takes priority.
tushare_token: ""

stock_pool:
  markets: ["主板", "创业板", "科创板"]
  min_listing_days: 60
  max_suspend_days: 10

select_count: 50

paths:
  output_dir: ./output
  cache_dir: ./cache
  log_dir: ./logs

logging:
  level: INFO
  file: run.log

# ============================================================================
# Multi-factor scoring model — 9 factors across 5 dimensions
# All factors derived from bak_basic (single API call) except volume_ratio
# which uses multi-day daily data.
# ============================================================================
factors:
  value:
    ep_ttm:
      weight: 0.15
      enabled: true
      direction: positive      # 1/PE, higher = cheaper
    bp:
      weight: 0.10
      enabled: true
      direction: positive      # 1/PB, higher = cheaper

  quality:
    roe_ttm:
      weight: 0.15
      enabled: true
      direction: positive      # EPS/BVPS
    gross_margin:
      weight: 0.10
      enabled: true
      direction: positive      # 毛利率 = 定价权
    net_margin:
      weight: 0.10
      enabled: true
      direction: positive      # 净利率 = 盈利质量

  growth:
    revenue_yoy:
      weight: 0.10
      enabled: true
      direction: positive      # 营收增速
    profit_yoy:
      weight: 0.10
      enabled: true
      direction: positive      # 利润增速

  size:
    small_cap:
      weight: 0.10
      enabled: true
      direction: positive      # -ln(total_assets), A股小盘溢价

  technical:
    volume_ratio:
      weight: 0.10
      enabled: true
      direction: positive      # 放量=资金关注

backtest:
  hold_period: 20
