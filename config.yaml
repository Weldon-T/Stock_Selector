# ============================================================================
# Stock Selection Tool - Configuration
# ============================================================================

tushare_token: ""

stock_pool:
  markets: ["主板", "创业板", "科创板"]
  min_listing_days: 60
  max_suspend_days: 10
  min_daily_amount: 50000      # 50M yuan (amount in thousands)

select_count: 50

paths:
  output_dir: ./output
  cache_dir: ./cache
  log_dir: ./logs

logging:
  level: INFO
  file: run.log

# ============================================================================
# Multi-factor scoring model — 10 factors across 5 dimensions
# Focus: investable quality, risk control, reasonable valuation
# ============================================================================
factors:
  value:
    ep_ttm:
      weight: 0.12
      enabled: true
      direction: positive      # 1/PE
    bp:
      weight: 0.08
      enabled: true
      direction: positive      # 1/PB

  quality:
    roe_ttm:
      weight: 0.15
      enabled: true
      direction: positive      # EPS/BVPS
    gross_margin:
      weight: 0.10
      enabled: true
      direction: positive      # 毛利率 = 定价权
    net_margin:
      weight: 0.10
      enabled: true
      direction: positive      # 净利率 = 盈利质量

  growth:
    revenue_yoy:
      weight: 0.08
      enabled: true
      direction: positive      # 营收增速
    profit_yoy:
      weight: 0.08
      enabled: true
      direction: positive      # 利润增速

  size:
    small_cap:
      weight: 0.08
      enabled: true
      direction: positive      # -ln(total_assets)

  risk:
    volatility:
      weight: 0.10
      enabled: true
      direction: negative      # 低波动 = 风险可控

    volume_ratio:
      weight: 0.05
      enabled: true
      direction: positive      # 适度放量

  # Total: 1.00 → normalized automatically

backtest:
  hold_months: 3
